window.craftoryAPI=async(m,path,b)=>{const[,r,id]=path.split('/'),o=x=>({status:200,data:x}),nf={status:404,data:{error:'Not found'}};
if(m=='GET'){if(r=='products')return id?(P(id)?o(P(id)):nf):o(S.prods);if(r=='categories')return o(S.cats);if(r=='orders')return o(S.orders);if(r=='reviews')return o(S.reviews);if(r=='cart')return o({items:S.cart,...calc()})}
if(m=='POST'&&r=='cart'){if(!b||!P(b.id))return{status:422,data:{error:'Unknown product id'}};add(b.id,b.q||1,b.v);return o(S.cart)}
if(m=='POST'&&r=='coupon'){const c=((b&&b.code)||'').toUpperCase();if(!CP[c])return{status:400,data:{error:'Invalid code'}};S.coupon=c;save();R();return o(calc())}
if(m=='PATCH'&&r=='orders'){const x=S.orders.find(q=>q.id==id);if(!x)return nf;x.status=b.status;save();return o(x)}
if(m=='DELETE'&&r=='cart'){S.cart=S.cart.filter(c=>c.id!=id);save();R();return o(S.cart)}
return{status:405,data:{error:'Not supported'}}};
function paintHero(){const c=$('#hc');if(!c)return;const x=c.getContext('2d'),W=c.width=800,H=c.height=600,C=['#c2185b','#e91e63','#8e24aa','#ce93d8','#f8bbd0','#4a148c','#ba68c8'],r=m=>Math.random()*m;x.fillStyle='#fff8fb';x.fillRect(0,0,W,H);let n=0,s=null,fd=0;const mk=()=>({a:[r(W),r(H)],b:[r(W),r(H)],m:[r(W),r(H)],col:C[r(C.length)|0],w:16+r(36),p:0}),tick=()=>{if(!c.isConnected)return;if(fd>0){x.globalAlpha=.12;x.fillStyle='#fff8fb';x.fillRect(0,0,W,H);if(!--fd)n=0}else{if(!s||s.p>=1){if(n>=12){fd=40;s=null}else{s=mk();n++}}if(s){const q=u=>[(1-u)**2*s.a[0]+2*(1-u)*u*s.m[0]+u*u*s.b[0],(1-u)**2*s.a[1]+2*(1-u)*u*s.m[1]+u*u*s.b[1]],p0=q(s.p);s.p+=.02;const p1=q(Math.min(1,s.p));x.globalAlpha=.4;x.strokeStyle=s.col;x.lineWidth=s.w;x.lineCap='round';x.beginPath();x.moveTo(p0[0],p0[1]);x.lineTo(p1[0],p1[1]);x.stroke()}}requestAnimationFrame(tick)};tick()}

about:()=>`<section><div class="w"><div class="two" style="align-items:center"><div><h2>Two friends, one shared sketchbook</h2><p class="pd">Craftory began on a kitchen table, with two friends splitting one sketchbook and a tin of mismatched paints. We could never find supplies that felt good, looked good and did not cost a fortune, so we started choosing them ourselves.</p><p class="pd">Today we stock paints, brushes, journals, stationery, stickers and craft kits for anyone who likes making things by hand. Every product is tested by our own team before it joins the shelf.</p></div>${pic(I[0],'🎨')}</div><div class="cats" style="margin:34px 0"><div class="box"><h2>26+</h2>products we love</div><div class="box"><h2>8</h2>craft categories</div><div class="box"><h2>3</h2>pickup stores</div><div class="box"><h2>30 days</h2>easy returns</div></div><div class="two" style="align-items:center">${pic(I[1],'📓')}<div><h2>What we care about</h2><p class="pd"><b>Made to be used.</b> Paper that does not bleed, paint that covers and pens that do not smudge.</p><p class="pd"><b>Kind to makers and the planet.</b> Recycled packaging, non-toxic pigments and fair prices for students.</p><p class="pd"><b>Friendly help.</b> Not sure which brush to pick? Message us and a real artist replies.</p></div></div><h2 style="margin-top:34px">Visit our stores</h2><div class="grid">${STORES.map((x,i)=>`<div class="card">${pic(I[i+2],'🏬')}<h3>${x.split(' – ')[0]}</h3><p>${x.split(' – ')[1]}<br>Mon to Sat, 10am to 7pm</p></div>`).join('')}</div><p style="margin-top:22px"><i>Craftory is a demo store built for testing. Products, stores and orders are not real.</i></p></div></section>`,

guide:()=>`<section><div class="w" style="max-width:820px"><h2>API testing guide</h2><div class="box pd"><h3>1. Test data</h3><ul><li>Customer: <b>demo@craftory.com</b> / demo123 (sign in from the account icon)</li><li>Admin: <b>admin@craftory.com</b> / admin123 (footer link, Admin login). Customer and admin sessions are separate.</li><li>Discount codes: CRAFT10 (10%), PINK20 (20% over $40), SAVE5 ($5 over $20). Tax is 13%.</li><li>Shipping: Free $0, Fast $12.99, Purolator $19.99. Test cards and COD are dummy.</li></ul></div><div class="box pd"><h3>2. Test the site's own API (browser console)</h3><p>This site keeps its data in your browser, so it has no web address you can call from another tool. Instead it ships a small mock API. Open DevTools (F12), choose Console on this page and run:</p><pre>await craftoryAPI('GET','/products')
await craftoryAPI('GET','/products/4')
await craftoryAPI('POST','/cart',{id:4,q:2,v:'Rose'})
await craftoryAPI('POST','/coupon',{code:'CRAFT10'})
await craftoryAPI('GET','/cart')
await craftoryAPI('PATCH','/orders/101',{status:'shipped'})
await craftoryAPI('DELETE','/cart/4')</pre><p>Each call returns <code>{status, data}</code>. Expect 200 for success, 404 for a missing id, 422 for a bad product id, 400 for a bad code. Check that the page updates too (cart count, totals).</p></div><div class="box pd"><h3>3. Real free HTTP APIs for your QA tool</h3><p>These public services need no key. Free tiers can change, so treat them as free for testing, not guaranteed forever.</p><pre>GET  https://dummyjson.com/products?limit=5
GET  https://dummyjson.com/products/search?q=phone
GET  https://dummyjson.com/carts/1
POST https://dummyjson.com/auth/login
     body: {"username":"emilys","password":"emilyspass"}
GET  https://jsonplaceholder.typicode.com/posts/1
GET  https://jsonplaceholder.typicode.com/posts/1/comments
POST https://jsonplaceholder.typicode.com/posts
     body: {"title":"Review","body":"Great paint","userId":1}</pre><p>In your API tool: create a collection, save <code>https://dummyjson.com</code> as a base-URL variable, add the requests above, then assert status 200 and that the response has the fields you expect (for example <code>products</code> is a non-empty list). Chain the login token into later requests.</p></div><div class="box pd"><h3>4. Manual test cases for this site</h3><ul><li>Add the same product in two styles: two separate cart lines appear.</li><li>Apply PINK20 under $40: rejected. Over $40: discount, tax and total update.</li><li>Checkout with Free shipping: address required. With Store pickup: store list shows.</li><li>Place an order, then in Admin change its status. The customer's My orders shows the new status.</li><li>Contact form: empty fields, bad email and short message each show an error.</li><li>Sign out of the customer account: the admin session stays signed in, and the reverse.</li></ul></div></div></section>`,
wishlist:()=>`<section><div class="w"><div class="row"><h2>Wishlist</h2><button class="btn o s" onclick="navigator.clipboard?.writeText(location.href.split('#')[0]+'#/wishlist?items='+S.wish);toast('Wishlist link copied')">Share wishlist</button></div><div class="grid">${S.wish.map(P).filter(Boolean).map(p=>`<div class="card">${img(p)}<h3>${p.name}</h3><div class="row"><span class="pr">${fm(p.price)}</span></div><button class="btn s" onclick="add(${p.id},1)">Add to cart</button> <button class="btn x s" onclick="tg('wish',${p.id})">Remove</button></div>`).join('')||'<p>No saved items yet. Tap the heart on any product.</p>'}</div></div></section>`,

account:t=>{if(!me())return location.hash='#/login','';const u=me(),T=[['orders','My orders'],['addr','Addresses'],['info','Account info'],['revs','My reviews'],['pay','Payment methods'],['wishlist','Wishlist'],['compare','Compare list']],mo=S.orders.filter(o=>o.uid==u.id);let b='';
if(t.startsWith('order/')){const id=t.split('/')[1],o=mo.find(x=>x.id==id);if(!o)b='<p>Order not found. <a class="pr" href="#/account/orders">Back to orders</a></p>';else{const sub=o.items.reduce((a,i)=>a+i.p*i.q,0),dc=o.disc||0,tx=o.tax||0,sh=Math.max(0,o.total-(sub-dc+tx)),stp=['pending','in progress','shipped','complete'],ix=stp.indexOf(o.status);
b=`<div class="row"><a class="btn o s" href="#/account/orders">← All orders</a><span class="st ${o.status.replace(' ','')}">${o.status}</span></div><div class="box"><h3>Order #${o.id}</h3><small>Placed on ${o.date}</small>${o.status=='cancel'?'<p class="err" style="margin:12px 0 0">This order was cancelled.</p>':`<div class="trk">${stp.map((x,i)=>`<div class="${i<=ix?'on':''}"><b>${i<ix?'✓':i+1}</b><span>${x}</span></div>`).join('')}</div>`}</div><div class="cg"><div class="box"><h3>Items</h3>${o.items.map(i=>{const p=P(i.id);return`<div class="ci">${p?img(p):'<div class="im">🎁</div>'}<div><b>${i.n}</b><br><small>${i.q} × ${fm(i.p)}</small></div><b>${fm(i.p*i.q)}</b></div>`}).join('')}</div><div><div class="box"><h3>Summary</h3><br><div class="row"><span>Subtotal</span><span>${fm(sub)}</span></div><div class="row"><span>Discount ${o.code?'('+o.code+')':''}</span><span>-${fm(dc)}</span></div><div class="row"><span>Tax</span><span>${fm(tx)}</span></div><div class="row"><span>Shipping</span><span>${fm(sh)}</span></div><div class="ln row"><b>Total</b><b>${fm(o.total)}</b></div></div><div class="box"><h3>Delivery</h3><p>${o.ship}</p></div><div class="box"><h3>Payment</h3><p>${o.pay}</p></div></div></div>`}}
else if(t=='orders')b=`<h3>My orders</h3>`+(mo.length?`<table><tr><th>#<th>Date<th>Total<th>Status<th></tr>${mo.map(o=>`<tr><td>${o.id}<td>${o.date}<td>${fm(o.total)}<td><span class="st ${o.status.replace(' ','')}">${o.status}</span><td><a class="pr" href="#/account/order/${o.id}">View</a></tr>`).join('')}</table>`:'<p>No orders yet.</p>');
else if(t=='addr')b=`<div class="row"><h3>My addresses</h3><button class="btn s" onclick="addrF()">Add address</button></div>`+(u.addrs.map(a=>`<div class="box row"><span>${a.name}, ${a.line}, ${a.city}, ${a.zip}</span><span><button class="ic" onclick="addrF(${a.id})">${ic('edit')}</button><button class="ic" onclick="ask('Delete this address?',()=>{u.addrs=u.addrs.filter(x=>x.id!=${a.id});save();R()})">${ic('del')}</button></span></div>`).join('')||'<p>No saved addresses.</p>');
else if(t=='info')b=`<h3>Account info</h3><label>First name</label><input id="ifn" value="${u.fn}"><label>Last name</label><input id="iln" value="${u.ln}"><label>Email</label><input id="iem" value="${u.email}"><label>New password (optional)</label><input id="ipw" type="password"><button class="btn" onclick="info()">Save changes</button> <button class="btn o" onclick="logout()">Sign out</button>`;
else if(t=='revs')b=`<h3>My reviews</h3>`+(S.reviews.filter(r=>r.uid==u.id).map(r=>`<div class="box row"><span><b>${P(r.pid)?.name}</b> <span class="stars">${stars(r.r)}</span><br>${r.txt}</span><button class="ic" onclick="ask('Delete this review?',()=>{S.reviews=S.reviews.filter(x=>x.id!=${r.id});save();R()})">${ic('del')}</button></div>`).join('')||'<p>You have not reviewed anything yet.</p>');
else if(t=='pay')b=`<h3>Payment methods</h3><div class="box">Credit card (dummy) and Cash on delivery (dummy) are available at checkout. No real card data is stored.</div>`;
else b=pg[t]().replace(/^<section><div class="w">/,'').replace(/<\/div><\/section>$/,'');
return`<section><div class="w"><div class="row"><h2>My account</h2><button class="btn o s" onclick="history.back()">← Back</button></div><div class="tabs">${T.map(x=>`<a class="${t.split('/')[0]==x[0]||(x[0]=='orders'&&t.startsWith('order/'))?'on':''}" href="#/account/${x[0]=='wishlist'||x[0]=='compare'?'':''}${x[0]}">${x[1]}</a>`).join('')}</div>${b}</div></section>`},
admin:t=>{if(!adm())return pg.adminlogin();
const T=[['dash','Dashboard'],['orders','Orders'],['prods','Products'],['cats','Menus / Categories'],['custs','Customers'],['revs','Reviews']];let b='';
const act=(k,id)=>`<button class="ic" onclick="crud('${k}',${id})">${ic('edit')}</button><button class="ic" onclick="del('${k}',${id})">${ic('del')}</button>`;
if(t=='dash')b=`<div class="grid">${[['Orders',S.orders.length],['Revenue',fm(S.orders.filter(o=>o.status!='cancel').reduce((a,o)=>a+o.total,0))],['Products',S.prods.length],['Customers',S.users.filter(x=>x.role=='user').length],['Reviews',S.reviews.length]].map(x=>`<div class="box"><div>${x[0]}</div><h2>${x[1]}</h2></div>`).join('')}</div>`;
if(t=='orders')b=`<table><tr><th>#<th>Customer<th>Total<th>Status<th></tr>${S.orders.map(o=>`<tr><td>${o.id}<td>${o.cust}<td>${fm(o.total)}<td><select style="margin:0" onchange="ost(${o.id},this.value)">${['pending','in progress','shipped','complete','cancel'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><td><button class="ic" onclick="del('orders',${o.id})">${ic('del')}</button></tr>`).join('')||'<tr><td>No orders yet</tr>'}</table>`;
if(t=='prods')b=`<button class="btn s" onclick="crud('prods')">Add product</button><br><br><table><tr><th>SKU<th>Name<th>Price<th></tr>${S.prods.map(p=>`<tr><td>${p.sku}<td>${p.name}<td>${fm(p.price)}<td>${act('prods',p.id)}</tr>`).join('')}</table>`;
if(t=='cats')b=`<button class="btn s" onclick="crud('cats')">Add menu / sub menu</button><br><br><table><tr><th>Name<th>Parent<th></tr>${S.cats.map(c=>`<tr><td>${c.name}<td>${S.cats.find(x=>x.id==c.p)?.name||'Top menu'}<td>${act('cats',c.id)}</tr>`).join('')}</table>`;
if(t=='custs')b=`<table><tr><th>Name<th>Email<th></tr>${S.users.filter(x=>x.role=='user').map(c=>`<tr><td>${c.fn} ${c.ln}<td>${c.email}<td><button class="ic" onclick="del('users',${c.id})">${ic('del')}</button></tr>`).join('')}</table>`;
if(t=='revs')b=`<table><tr><th>Product<th>By<th>Review<th></tr>${S.reviews.map(r=>`<tr><td>${P(r.pid)?.name}<td>${r.name}<td>${stars(r.r)} ${r.txt}<td><button class="ic" onclick="del('revs',${r.id})">${ic('del')}</button></tr>`).join('')}</table>`;
return`<section><div class="w"><div class="box row"><b>👑 Admin panel · ${adm().email}</b><span><a class="btn o s" href="#/">View store</a> <button class="btn s" onclick="alogout()">Sign out</button></span></div><div class="ad"><div class="tabs">${T.map(x=>`<a class="${t==x[0]?'on':''}" href="#/admin/${x[0]}">${x[1]}</a>`).join('')}</div><div style="overflow:auto">${b}</div></div></div></section>`}};
const qty=(id,v,n)=>{S.cart.find(c=>c.id==id&&c.v==v).q=Math.max(1,+n||1);save();R()};
const F={prods:[['name','Name'],['cat','Category','sel',()=>S.cats.map(c=>[c.id,c.name])],['price','Price','number'],['sku','SKU'],['desc','Description','area'],['em','Emoji'],['i1','Product image (choose file)','file'],['i0','Or image URL (https)']],cats:[['name','Name'],['p','Parent','sel',()=>[[0,'Top menu'],...S.cats.map(c=>[c.id,c.name])]]]};
function crud(k,id){const a=S[k],o=id?a.find(x=>x.id==id):{},fs=F[k].map(f=>f[3]?[f[0],f[1],f[2],f[3]()]:f);form((id?'Edit ':'Add ')+(k=='prods'?'product':'menu item'),fs,{...o,i0:(o.img&&/^http/.test(o.img[0])?o.img[0]:'')},v=>{const u=v.i1||v.i0;delete v.i0;delete v.i1;['price','cat','p'].forEach(n=>{if(n in v)v[n]=+v[n]});if(id)Object.assign(o,v);else a.push({id:nid(a),stock:50,img:[I[0],I[1],I[2]],vr:VAR[0],em:'✨',sku:'CR-'+Date.now()%10000,...v});if(k=='prods'&&u&&/^(http|data:image)/.test(u)){const t=id?o:a[a.length-1];t.img=[u,...t.img.slice(1)]}save();R();toast('Saved')})}
function del(k,id){ask('Delete this item? This cannot be undone.',()=>{S[k]=S[k].filter(x=>x.id!=id);if(k=='cats')S.cats.forEach(c=>{if(c.p==id)c.p=0});save();R();toast('Deleted')})}
const ost=(id,s)=>{S.orders.find(o=>o.id==id).status=s;save();toast('Status set to '+s)};
function review(id){if(!S.me){location.hash='#/login';return toast('Sign in to write a review')}form('Write a review',[['r','Rating','sel',[5,4,3,2,1].map(n=>[n,n+' stars'])],['txt','Your review','area']],{r:5},v=>{S.reviews.push({id:nid(S.reviews),pid:id,uid:S.me,name:me().fn+' '+me().ln[0]+'.',r:+v.r,txt:v.txt||'(no comment)'});save();R();toast('Review added')})}
function addrF(id){const u=me(),o=id?u.addrs.find(a=>a.id==id):{};form(id?'Edit address':'Add address',[['name','Full name'],['line','Street address'],['city','City'],['zip','Postal code']],o,v=>{if(id)Object.assign(o,v);else u.addrs.push({id:nid(u.addrs),...v});save();R();toast('Address saved')})}
function info(){const u=me();u.fn=$('#ifn').value;u.ln=$('#iln').value;u.email=$('#iem').value;if($('#ipw').value)u.pw=$('#ipw').value;save();toast('Account updated');R()}
function login(){const u=S.users.find(x=>x.role!='admin'&&x.email==$('#e').value&&x.pw==$('#pw').value);if(!u)return toast('Wrong email or password');S.me=u.id;save();location.hash='#/account/orders'}
function signup(){const v=['sf','sl','se','sp'].map(i=>$('#'+i).value.trim());if(v.includes(''))return toast('Fill in all fields');if(S.users.some(u=>u.email==v[2]))return toast('That email is already registered');S.users.push({id:nid(S.users),fn:v[0],ln:v[1],email:v[2],pw:v[3],role:'user',addrs:[]});S.me=S.users.at(-1).id;save();location.hash='#/account/orders'}
const STORES=['Downtown Studio – 12 Studio Lane','Mall Kiosk – Level 2, City Mall','Westside Outlet – 88 Oak Road'];
function ck(){const u=me(),d=$('#dm').value,[sp]=$('#sm').value.split('|');$('#dx').innerHTML=d=='pick'?`<label>Pickup store</label><select id="st">${STORES.map(s=>`<option>${s}</option>`).join('')}</select>`:`<input id="an" placeholder="Full name" value="${u.fn} ${u.ln}"><input id="al" placeholder="Street address" value="${u.addrs[0]?.line||''}"><input id="ac" placeholder="City" value="${u.addrs[0]?.city||''}"><input id="az" placeholder="Postal code" value="${u.addrs[0]?.zip||''}">`;
$('#px').innerHTML=$('#pm').value=='card'?'<input placeholder="Card number (use any dummy number)"><input placeholder="MM/YY"><input placeholder="CVC">':'<p>Pay in cash when your order arrives.</p>';$('#shp').textContent=fm(sp);$('#tot').textContent=fm(calc(+sp).total)}
function place(){const d=$('#dm').value;if(d=='ship'&&['an','al','ac','az'].some(i=>!$('#'+i).value.trim()))return toast('Complete the shipping address');const[sp,sn]=$('#sm').value.split('|'),u=me(),id=++S.seq;S.orders.push({id,uid:u.id,cust:u.fn+' '+u.ln,date:new Date().toLocaleDateString(),status:'pending',ship:(d=='pick'?'Pickup: '+$('#st').value:'Ship to '+$('#al').value+', '+$('#ac').value)+' · '+sn,pay:$('#pm').value=='card'?'Credit card (dummy)':'Cash on delivery',total:calc(+sp).total,disc:calc().disc,tax:calc(+sp).tax,code:calc().code,items:S.cart.map(c=>({id:c.id,n:P(c.id).name+' ('+c.v+')',q:c.q,p:P(c.id).price}))});S.cart=[];S.coupon='';save();modal(`<h3>Order #${id} placed 🎉</h3><p style="margin:10px 0 16px">Thanks! You can follow its status under My orders.</p><a class="btn" href="#/account/orders" onclick="closeM()">View my orders</a>`);location.hash='#/account/orders'}
function R(){const[,r,a,b]=(location.hash.split('?')[0]||'#/').split('/');const t=r=='account'?pg.account(a?(b?a+'/'+b:a):'orders'):r=='admin'?pg.admin(a||'dash'):r=='wishlist'||r=='compare'?(S.me?pg.account(r):pg[r]()):r=='cat'?pg.cat(a):r=='p'?pg.p(a):r&&pg[r]?pg[r]():pg.home();$('#app').innerHTML=nav()+'<main>'+t+'</main>'+foot();if(r=='checkout'&&S.me&&S.cart.length)ck();document.body.dataset.r=r;paintHero()}
addEventListener('hashchange',()=>{scrollTo(0,0);R()});R();
</script></body></html>
